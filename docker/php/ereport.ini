; Disamakan dengan php-fpm-83 native serverone.
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
expose_php = Off
; Defense-in-depth mitigasi PHP2Shell (CVE-2026-109618, CVE-2026-109619, CVE-2026-115560).
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kode di image immutable, jadi tidak perlu cek timestamp file tiap request.
opcache.validate_timestamps = 0
