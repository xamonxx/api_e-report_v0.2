; Dimuat setelah zz-docker.conf bawaan image, jadi nilai di sini yang berlaku.
; serverone memakai network_mode: host — wajib bind loopback, karena UFW
; mengizinkan LAN/tailnet ke port apa pun.
[www]
listen = 127.0.0.1:9100
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
